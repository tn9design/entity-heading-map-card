<!doctype html><html><head><meta charset="utf-8"><title>Vector map beta test</title><style>body{background:#202124;color:white;font:14px system-ui;margin:20px}#cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px}button{margin:4px}entity-heading-map-card-beta{--card-background-color:#252525;--primary-text-color:white}@media(max-width:600px){#cards{grid-template-columns:1fr}}</style></head><body>
<h1>Vector map beta test</h1><p>Synthetic vehicle positions in Manhattan; no live entities are changed.</p>
<button onclick="fixture.theme()">Toggle theme</button><button onclick="fixture.labels()">Toggle labels</button><button onclick="fixture.turn()">Rotate cars</button><button onclick="fixture.move()">Move cars</button><button onclick="fixture.provider()">Switch provider</button><button onclick="fixture.recreate()">Recreate cards</button>
<div id="cards"></div><pre id="status"></pre>
<script type="module">
await import('/dist/entity-heading-map-card-beta.js');
let tokenRequests=0;
const connection={options:{auth:{data:{hassUrl:location.origin}}},sendMessagePromise:async()=>{tokenRequests++;const r=await fetch('/__map_token');if(!r.ok)throw Error('No map service');return r.json();},addEventListener(){},removeEventListener(){}};
const states={'sun.sun':{state:'below_horizon'},'sensor.gear':{state:'D'},'sensor.speed':{state:'5',attributes:{unit_of_measurement:'mph'}},'sensor.car0':{state:'home',attributes:{latitude:40.754,longitude:-73.985,heading:100,friendly_name:'Onyx'}},'sensor.car1':{state:'home',attributes:{latitude:40.7543,longitude:-73.9854,heading:267,friendly_name:'Barb'}}};
const hass={connection,states,themes:{darkMode:false},callService(){throw Error('Services disabled in fixture');}};
let cards=[],configs=[];
const names=['onyx-model-s','barb-model-3'];
function create(){cards=[];document.querySelector('#cards').replaceChildren();for(let i=0;i<2;i++){const card=document.createElement('entity-heading-map-card-beta');const cfg=configs[i]||{type:'custom:entity-heading-map-card-beta',entity:'sensor.car'+i,map_provider:'home_assistant',map_theme:'auto',height:360,zoom:18,show_header:true,title:i?'Barb':'Onyx',marker_type:'image',marker_image:'/local/car-map-markers/'+names[i]+'-day.png',marker_image_night:'/local/car-map-markers/'+names[i]+'-night.png',marker_image_mode:'auto',marker_image_size:80,show_headlights:true,gear_entity:'sensor.gear',speed_entity:'sensor.speed',show_speedometer:true,show_map_labels:true,marker_tooltip_mode:'name'};configs[i]=cfg;card.setConfig(cfg);card.hass=hass;document.querySelector('#cards').append(card);cards.push(card);}}
window.fixture={get tokenRequests(){return tokenRequests;},get cards(){return cards;},hass,configs,theme(){hass.themes.darkMode=!hass.themes.darkMode;cards.forEach(c=>c.hass=hass);},labels(){configs.forEach(c=>c.show_map_labels=!c.show_map_labels);cards.forEach((c,i)=>c.setConfig(configs[i]));},turn(){for(let i=0;i<2;i++)states['sensor.car'+i].attributes.heading=(states['sensor.car'+i].attributes.heading+45)%360;cards.forEach(c=>c.hass=hass);},move(){for(let i=0;i<2;i++)states['sensor.car'+i].attributes.latitude+=.0001;cards.forEach(c=>c.hass=hass);},provider(){configs.forEach(c=>{c.map_provider=c.map_provider==='home_assistant'?'custom':'home_assistant';c.tile_url='/api/map_tiles/raster/{z}/{x}/{y}.png';});cards.forEach((c,i)=>c.setConfig(configs[i]));},recreate:create};
create();
setInterval(()=>document.querySelector('#status').textContent=JSON.stringify(cards.map(c=>({mode:c._haBackground?.mode,status:c._providerStatus,markers:c._markers.size,canvases:c.shadowRoot.querySelectorAll('canvas').length})),null,2),1000);
</script></body></html>
